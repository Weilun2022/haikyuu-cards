<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>牌組檢視（管理者）</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { background-image: none; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 16px; margin-right: auto; }
  .status { font-size: 12px; color: var(--text-dim); }
  button.btn { padding: 7px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  button.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 16px; font-size: 13px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 160px; font-size: 14px; }
  .msg { padding: 40px 16px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .msg.err { color: var(--danger); }
  main { display: grid; grid-template-columns: 280px 1fr; gap: 14px; padding: 0 16px 40px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel h2 { font-size: 13px; padding: 10px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .list { max-height: 70vh; overflow-y: auto; }
  .row { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 13px; cursor: pointer; }
  .row:hover { background: var(--surface2); }
  .row.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .row .sub { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .decks { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .decks .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .deck-head { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
  .deck-head b { font-size: 15px; }
  .deck-head span { font-size: 12px; color: var(--text-dim); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; padding: 0 12px 14px; }
  .c { position: relative; display: block; }
  .c img { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); aspect-ratio: 5/7; object-fit: cover; }
  .c .n { position: absolute; right: 4px; top: 4px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700;
    padding: 1px 7px; border-radius: 999px; }
  .c .t { font-size: 11px; margin-top: 3px; line-height: 1.3; word-break: break-all; }
  .hint { font-size: 12px; color: var(--text-dim); padding: 10px 12px; }
  .data-note { font-size: 12px; line-height: 1.7; color: var(--text-dim); padding: 10px 16px 0; }

  /* ── 分析面板 ── */
  .tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  .tab { padding: 7px 16px; border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0;
    background: var(--surface2); color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab.active { background: var(--surface); color: var(--text); }
  #view-analysis { display: grid; gap: 14px; padding: 14px 16px 40px; }
  .a-caveat { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 11px 14px; font-size: 12.5px; line-height: 1.7; color: var(--text-dim); }
  .a-caveat b { color: var(--text); }
  .a-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px 14px; }
  .a-panel h2 { font-size: 14px; margin: 0 -14px 12px; padding: 10px 14px;
    background: var(--surface2); border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .a-note { font-size: 12px; line-height: 1.75; color: var(--text-dim); margin: 10px 0 0; }
  .a-warn { color: var(--danger); }
  .a-denom { font-size: 11.5px; color: var(--text-dim); margin-left: auto; }
  .a-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .a-tab { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .a-tab.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .a-select { padding: 5px 9px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 12.5px; max-width: 220px; }
  .a-select.wide { max-width: 340px; }
  .a-cards { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .a-card { flex: 1 1 118px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .a-card b { display: block; font-size: 20px; line-height: 1.25; }
  .a-card span { display: block; font-size: 11.5px; }
  .a-card i { display: block; font-size: 11px; color: var(--text-dim); font-style: normal; }
  .a-bars { display: grid; gap: 4px; }
  .a-bar { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 8px; font-size: 12px; }
  .a-bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .a-bar-track { height: 14px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .a-bar-track i { display: block; height: 100%; background: var(--accent); }
  .a-bar-value { color: var(--text-dim); font-size: 11.5px; white-space: nowrap; }
  .a-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .a-table th, .a-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  .a-table th { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  .a-cardname { display: block; }
  .a-cardno { font-size: 10.5px; color: var(--text-dim); font-style: normal; }
  .a-heat { background: color-mix(in srgb, var(--accent) calc(var(--heat) * 100%), transparent); font-variant-numeric: tabular-nums; }
  .a-rep { margin-bottom: 14px; }
  .a-rep-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 12px;
    color: var(--text-dim); padding-bottom: 6px; }
  .a-rep-head b { font-size: 13px; color: var(--text); }
  .a-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; }
  .a-wall-c { position: relative; }
  .a-wall-c img { width: 100%; display: block; border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface2); aspect-ratio: 5/7; object-fit: cover; }
  .a-wall-ph { display: grid; place-items: center; aspect-ratio: 5/7; border: 1px dashed var(--border);
    border-radius: 5px; font-size: 9px; word-break: break-all; padding: 2px; color: var(--text-dim); }
  .a-wall-n { position: absolute; right: 3px; top: 3px; background: var(--accent); color: var(--on-accent);
    font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 999px; }
  .a-youth { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin: 8px 0; }
  .a-youth i { color: var(--text-dim); font-size: 11.5px; font-style: normal; }
  .a-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-top: 10px; }
  .a-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; font-size: 11.5px; }
  .a-stat b { display: block; font-size: 12.5px; margin-bottom: 5px; }
  .a-stat span, .a-stat i { display: block; color: var(--text-dim); font-style: normal; }
  /* 下方留白是給 .a-hist-bar i 的絕對定位數值軸標籤站的，縮掉會疊到底下的文字 */
  .a-hist { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin-bottom: 18px; }
  .a-hist-bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; position: relative; }
  .a-hist-bar i { position: absolute; left: 0; right: 0; bottom: -14px; text-align: center; font-size: 9.5px;
    color: var(--text-dim); font-style: normal; }
  .a-stack { display: flex; height: 24px; border-radius: 6px; overflow: hidden; margin-top: 20px; font-size: 10.5px; }
  .a-stack-seg { display: grid; place-items: center; color: var(--text); white-space: nowrap; overflow: hidden; }
  .seg-free { background: var(--use-free); } .seg-receive { background: var(--use-receive); }
  .seg-set { background: var(--use-set); } .seg-attack { background: var(--use-attack); }
  .seg-event { background: var(--use-event); } .seg-unassigned { background: var(--surface2); color: var(--text-dim); }
  .a-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }  /* .tag 直接沿用上面瀏覽面板那顆 */
  .a-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .a-li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 6px 10px;
    border-bottom: 1px solid var(--border); font-size: 12px; }
  .a-li b { font-size: 12.5px; }
  .a-li span, .a-li i { color: var(--text-dim); font-size: 11.5px; font-style: normal; }
</style>
</head>
<body>
<header class="top">
  <h1>牌組檢視（管理者）</h1>
  <span class="status" id="loaded-at"></span>
  <span class="status" id="status">載入中…</span>
  <button class="btn" id="btn-refresh" hidden>重新整理</button>
  <button class="btn primary" id="btn-login" hidden>Google 登入</button>
  <button class="btn" id="btn-logout" hidden>登出</button>
</header>

<div id="gate" class="msg">載入中…</div>

<div id="app" hidden>
  <p class="data-note" id="data-note"></p>
  <nav class="tabs">
    <button class="tab active" id="tab-browse">帳號／牌組</button>
    <button class="tab" id="tab-analysis">分析面板</button>
  </nav>

  <div id="view-browse">
    <div class="toolbar">
      <label><input type="checkbox" id="f-quick"> 顯示「快速查詢」</label>
      <label><input type="checkbox" id="f-empty"> 顯示空牌組</label>
      <label><input type="checkbox" id="f-deleted"> 顯示已刪除</label>
      <label><input type="checkbox" id="f-40"> 只看 40 張</label>
      <input type="search" id="q" placeholder="搜尋卡片（卡號 / 日文名 / 中文名），找出誰的牌組有放">
    </div>
    <main>
      <section class="panel"><h2 id="acc-title">帳號</h2><div class="list" id="accounts"></div></section>
      <section class="panel" id="detail"><div class="msg">從左邊選一個帳號</div></section>
    </main>
  </div>

  <div id="view-analysis" hidden></div>
</div>

<script src="cards_data.js"></script>
<script type="module" src="js/admin-decks.js"></script>
</body>
</html>
