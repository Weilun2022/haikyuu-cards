name: 店家賽程表自動更新

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小時
  workflow_dispatch:          # 可手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取官方賽程表
        run: node fetch_schedule.js

      - name: 有變動才 commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet schedule_data.js schedule_registry.json; then
            git add schedule_data.js schedule_registry.json
            git commit -m "chore(schedule): 自動更新店家賽程 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "無變動，跳過 commit"
          fi
