// ══════════════════════════════════════════════════════
// CLOUD SYNC v2（自動同步，見 js/cloud-sync.js）
// 設計原則：自動同步只做安全的新增/更新/下載，絕不會用「本機少了某副牌組」去推斷
// 要刪雲端；只有明確按刪除鈕才會同步刪除。詳見 cloud-sync.js 檔頭註解。
// ══════════════════════════════════════════════════════

function hvDeckSig(d) { return JSON.stringify(d) + '|' + JSON.stringify(deckColorState[d.id] || null); }
function hvSnapshotDeckState() {
  _hvDeckSnapshot = {};
  decks.forEach(d => { _hvDeckSnapshot[d.id] = hvDeckSig(d); });
}

function hvOnLocalChange() {
  if (_hvApplyingRemote) return;
  const user = window.hvCloudSync?.currentUser;
  if (!user) { hvSnapshotDeckState(); return; }
  let changed = false;
  decks.forEach(d => {
    if (_hvDeckSnapshot[d.id] !== hvDeckSig(d)) {
      window.hvCloudSync.markDirty(user.uid, d.id);
      changed = true;
    }
  });
  hvSnapshotDeckState();
  if (changed) hvScheduleAutoSync('local-change', 1500);
}

function hvOnFavoritesChange() {
  if (_hvApplyingRemote) return;
  if (!window.hvCloudSync?.currentUser) return;
  hvScheduleAutoSync('favorites-change', 1500);
}

let _hvSyncTimer = null;
let _hvSyncRerunReason = null; // 上一輪同步跑到一半又有新請求進來時，記住原本的 reason（尤其是 'manual'，
                                // 不能被沖淡成自動同步，不然使用者剛確認的刪除就推不上去了）
function hvScheduleAutoSync(reason, delay) {
  if (!window.hvCloudSync?.currentUser) return;
  clearTimeout(_hvSyncTimer);
  _hvSyncTimer = setTimeout(() => hvRunAutoSync(reason), delay);
}

function hvEnsureQuickDeck() {
  if (!decks.find(d => d.id === QUICK_DECK_ID)) {
    decks.unshift({ id: QUICK_DECK_ID, name: '快速查詢', cards: [], owned: {} });
  }
}

async function hvRunAutoSync(reason) {
  const user = window.hvCloudSync?.currentUser;
  if (!user) return;
  if (window.hvCloudSync.getStatus().syncing) {
    // 保留優先權最高的 reason：一旦有 manual 請求排隊，重跑時就不能被降級成自動同步
    if (reason === 'manual' || _hvSyncRerunReason !== 'manual') _hvSyncRerunReason = reason;
    return;
  }
  try {
    const pushDeletes = reason === 'manual';
    const result = await window.hvCloudSync.autoReconcile(user.uid, decks, deckColorState, { pushDeletes });
    if (!result) return;
    const { applyDownload, applyRemoveLocal, restoredFromLoss, conflictCount, deletesPushed, pendingDeleteCount } = result;
    let localTouched = false;

    // 先記住這次同步有沒有動到「使用者目前正在看的那副牌組」，
    // 決定等等要不要重畫牌組面板/牌牆（別的牌組背景同步完不應該打斷使用者正在瀏覽的畫面）
    const prevCurrentDeckId = currentDeckId;
    const currentDeckRemoved = applyRemoveLocal.includes(prevCurrentDeckId);
    const currentDeckDownloaded = applyDownload.some(d => d.id === prevCurrentDeckId);

    if (applyRemoveLocal.length) {
      decks = decks.filter(d => !applyRemoveLocal.includes(d.id));
      applyRemoveLocal.forEach(id => delete deckColorState[id]);
      localTouched = true;
    }
    if (applyDownload.length) {
      applyDownload.forEach(({ id, deck, color }) => {
        normalizeDeck(deck);
        const idx = decks.findIndex(d => d.id === id);
        if (idx >= 0) decks[idx] = deck; else decks.push(deck);
        if (color != null) deckColorState[id] = color; else delete deckColorState[id];
      });
      localTouched = true;
    }

    if (localTouched) {
      hvEnsureQuickDeck();
      let switchedAway = false;
      if (!decks.find(d => d.id === currentDeckId)) {
        currentDeckId = decks.find(d => d.id === QUICK_DECK_ID)?.id || decks[0]?.id || null;
        switchedAway = true;
      }
      // 等等 await 期間使用者仍可能手動切牌組，記住這次同步「預期」使用者看到的牌組是哪一副，
      // await 回來後如果 currentDeckId 已經不是這副，代表使用者自己切走了，不要再打斷他
      const targetDeckId = currentDeckId;
      _hvApplyingRemote = true;
      saveDecks(); saveColorState();
      _hvApplyingRemote = false;
      hvSnapshotDeckState();
      await window.hvCloudSync.commitLocalBaseline(user.uid, decks, deckColorState);

      // 左下角牌組清單永遠同步更新（這是這次要修的 bug：之前漏呼叫，要重整頁面才會更新）
      renderDeckSwitcher();
      // 牌組面板/牌牆比較重（renderGrid 會整個重建卡牌牆），只有在使用者目前正在看的
      // 牌組真的被這次同步動到時才重畫，避免背景同步到「別的」牌組時打斷使用者正在瀏覽的畫面
      if ((currentDeckRemoved || currentDeckDownloaded || switchedAway) && currentDeckId === targetDeckId) {
        renderDeckPanel(); updateTray(); renderGrid();
        // 缺卡清單是獨立 overlay，不跟著 renderDeckPanel 一起重畫，要另外處理：
        // 牌組還在但內容被雲端更新（例如別的裝置勾了持有）就即時刷新；牌組整個被刪除就直接關閉，
        // 不然使用者會繼續看著一份已經不存在的牌組資料
        const analysisOpen = document.getElementById('analysis-overlay').classList.contains('open');
        if (analysisOpen) {
          if (switchedAway) closeAnalysis();
          else renderAnalysis();
        }
        // 牌組操作選單（改名/新增/複製/刪除/清空）如果還開著，這次同步換掉了目前牌組，
        // 選單裡的操作對象已經不是使用者原本以為的那副，直接收合避免誤按
        if (switchedAway) document.getElementById('deck-menu-details')?.removeAttribute('open');
        if (switchedAway) {
          const newDeck = getCurrentDeck();
          showToast(`目前牌組已在其他裝置刪除，已切換到「${newDeck ? newDeck.name : '其他牌組'}」`);
        }
      }
    }

    if (restoredFromLoss) showToast('偵測到本機牌組資料遺失，已自動從雲端還原');
    else if (conflictCount > 0) showToast(`發現 ${conflictCount} 副牌組雙邊都有修改，已保留雙方版本`);
    else if (deletesPushed > 0) showToast(`已從雲端移除 ${deletesPushed} 副刪除的牌組`);
    // 持續提醒交給狀態列文字（hvRenderCloudUI），避免每次自動同步都跳 toast

    const favResult = await window.hvCloudSync.reconcileFavorites(user.uid, window.HVFavorites.getSnapshot().items);
    if (favResult?.changed) {
      window.HVFavorites.applySnapshot(favResult.items);
    }

    hvRenderCloudUI(window.hvCloudSync.getStatus());
  } catch (e) {
    console.error('[cloud-sync] auto sync failed', e);
    // 失敗時一定要讓使用者看得出來，不然狀態文字會卡在原地不動、分不清是還在跑還是失敗了
    showToast('同步失敗，請檢查網路連線，稍後會自動重試');
    hvRenderCloudUI(window.hvCloudSync.getStatus());
  } finally {
    if (_hvSyncRerunReason) {
      const rerunReason = _hvSyncRerunReason;
      _hvSyncRerunReason = null;
      hvScheduleAutoSync(rerunReason, 0);
    }
  }
}

function hvRenderCloudUI(status) {
  const signedOutRow = document.getElementById('cloud-signed-out-row');
  const signedInRow  = document.getElementById('cloud-signed-in-row');
  const statusText   = document.getElementById('cloud-sync-status-text');
  if (!signedOutRow || !signedInRow) return;
  if (status.user) {
    signedOutRow.style.display = 'none';
    signedInRow.style.display  = 'flex';
    const name = status.user.displayName || status.user.email || '已登入';
    let stateLabel;
    if (status.syncing) stateLabel = '同步中…';
    else if (status.hasPendingDeletes) stateLabel = '有刪除/清空尚未同步，按「立即同步」確認';
    else if (status.hasPending) stateLabel = '即將自動同步…';

    signedInRow.style.display  = 'none';

}

// ── Color State Helpers ─────────────────────────────────────────────────
function getCardColorMap(deckId, imageFile) {
  return (deckColorState[deckId] || {})[imageFile] || null;
}
function setCardColorMap(deckId, imageFile, colorMap) {
  if (!deckColorState[deckId]) deckColorState[deckId] = {};
  deckColorState[deckId][imageFile] = colorMap;
  saveColorState();
}
function clearCardColorMap(deckId, imageFile) {
  if (deckColorState[deckId]) {
    delete deckColorState[deckId][imageFile];
    saveColorState();
  }
}

function trimCardColorMap(deckId, imageFile, newCount) {
  const colorMap = getCardColorMap(deckId, imageFile);
  if (!colorMap) return;
  const assigned = COLOR_TAGS.reduce((s, { key }) => s + (colorMap[key] || 0), 0);
  if (newCount >= assigned) return;
  if (newCount <= 0) { clearCardColorMap(deckId, imageFile); return; }
  let excess = assigned - newCount;
  for (let i = COLOR_TAGS.length - 1; i >= 0 && excess > 0; i--) {
    const key = COLOR_TAGS[i].key;
    const trim = Math.min(colorMap[key] || 0, excess);
    colorMap[key] = (colorMap[key] || 0) - trim;
    excess -= trim;
  }
  const allZero = COLOR_TAGS.every(({ key }) => !colorMap[key]);
  if (allZero) clearCardColorMap(deckId, imageFile);
  else setCardColorMap(deckId, imageFile, colorMap);
}

// Hex color → rgba string for background tint
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Compute per-color totals for a deck (for stats row)
function getColorStats(deck) {
  const stats = { free: 0, receive: 0, set: 0, attack: 0, event: 0 };
  const cs = deckColorState[deck.id] || {};
  for (const entry of deck.cards) {
    const card = cards.find(c => c.image_file === entry.image_file);
    if (card && card.category === 'EVENT') { stats.event += entry.count; continue; }
    const cm = cs[entry.image_file];
    if (cm) {
      for (const { key } of COLOR_TAGS) stats[key] += cm[key] || 0;
    }
  }
  return stats;
}

// Render/update the merged 自由/接球/舉球/攻擊/事件/牌組總數 stats row (two-tier badges).
function renderDeckStatsRow(deck) {
  const stats = getColorStats(deck);
  const total = getTotalCount(deck);
  const over = total > 40;
  const row = COLOR_TAGS.map(({ key, label }) => ({ key, label, count: stats[key] }));
  row.push({ key: 'event', label: '事件', count: stats.event });

  let statsEl = document.getElementById('deck-stats-row');
  if (!statsEl) {
    statsEl = document.createElement('div');
    statsEl.id = 'deck-stats-row';
    statsEl.className = 'deck-stats-row';
    const body = document.querySelector('.deck-panel-body');
    body.parentNode.insertBefore(statsEl, body);
  }
  statsEl.innerHTML = row.map(({ key, label, count }) =>
    `<div class="deck-stat deck-stat-${key}">
       <span class="deck-stat-label">${label}</span>
       <span class="deck-stat-badge">${count}</span>
     </div>`
  ).join('') + `
    <div class="deck-stat deck-stat-total${over ? ' over' : ''}">
      <span class="deck-stat-label">牌組</span>
      <span class="deck-stat-badge">${total}/40</span>
    </div>`;
}

// Expand deck.cards into canvas entries (each color group → separate slot)
// Flat expansion in deck order (used internally)
function expandEntriesForCanvas(deck) {
  const cs = deckColorState[deck.id] || {};
  const result = [];
  for (const entry of deck.cards) {
    const card = cards.find(c => c.image_file === entry.image_file);
    const isEvent = card && card.category === 'EVENT';
    if (isEvent) {
      result.push({ ...entry, borderColor: EVENT_COLOR_HEX });
    } else {
      const cm = cs[entry.image_file];
      if (!cm) {
        result.push({ ...entry, borderColor: null });
      } else {
        const assignedTotal = COLOR_TAGS.reduce((s, { key }) => s + (cm[key] || 0), 0);
        const unassigned = entry.count - assignedTotal;
        if (unassigned > 0) result.push({ ...entry, count: unassigned, borderColor: null });
        for (const { key, hex } of COLOR_TAGS) {
          const cnt = cm[key] || 0;
          if (cnt > 0) result.push({ ...entry, count: cnt, borderColor: hex });
        }
      }
    }
  }
  return result;
}

// Grouped expansion for export: 未設定 → 自由 → 接球 → 舉球 → 攻擊 → 事件
function expandEntriesForCanvasGrouped(deck) {
  const cs = deckColorState[deck.id] || {};
  const groups = { unassigned: [], free: [], receive: [], set: [], attack: [], event: [] };

  for (const entry of deck.cards) {
    const card = cards.find(c => c.image_file === entry.image_file);
    const isEvent = card && card.category === 'EVENT';
    if (isEvent) {
      groups.event.push({ ...entry, borderColor: EVENT_COLOR_HEX });
    } else {
      const cm = cs[entry.image_file];
      if (!cm) {
        groups.unassigned.push({ ...entry, borderColor: null });
      } else {
        const assignedTotal = COLOR_TAGS.reduce((s, { key }) => s + (cm[key] || 0), 0);
        const unassigned = entry.count - assignedTotal;
        if (unassigned > 0) groups.unassigned.push({ ...entry, count: unassigned, borderColor: null });
        for (const { key, hex } of COLOR_TAGS) {
          const cnt = cm[key] || 0;
          if (cnt > 0) groups[key].push({ ...entry, count: cnt, borderColor: hex });
        }
      }
    }
  }
  const grouped = [
    ...groups.unassigned,
    ...groups.free,
    ...groups.receive,
    ...groups.set,
    ...groups.attack,
    ...groups.event,
  ];
  // 單卡呈現，不堆疊：每張複本各自一格，比照牌組管理面板的版面
  const expanded = [];
  for (const entry of grouped) {
    for (let i = 0; i < entry.count; i++) {
      expanded.push({ ...entry, count: 1 });
    }
  }
  return expanded;
}

// 取得當前牌組的持有資料（per-deck）
function getDeckOwned() {
  const deck = getCurrentDeck();
  if (!deck) return {};
  if (!deck.owned) deck.owned = {};
  return deck.owned;
}

// ── Deck helpers ───────────────────────────────────────
function getCurrentDeck() { return decks.find(d => d.id === currentDeckId) || null; }
function makeDeckId()     { return 'dk_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }

function createDeck(name) {
  const d = { id: makeDeckId(), name: name || '新牌組', cards: [], owned: {} };
  decks.push(d);
  currentDeckId = d.id;
  saveDecks();
  renderDeckSwitcher();
  return d;
}

function duplicateDeck() {
  const src = getCurrentDeck();
  if (!src) { showToast('沒有選取的牌組'); return; }
  const newName = src.name + '（副本）';
  const d = {
    id: makeDeckId(),
    name: newName,
    cards: JSON.parse(JSON.stringify(src.cards)),
    owned: JSON.parse(JSON.stringify(src.owned || {}))
  };
  decks.push(d);
  currentDeckId = d.id;
  saveDecks();
  renderDeckSwitcher(); renderDeckPanel(); updateTray(); renderGrid();
  showToast(`已複製為「${newName}」`);
}

function getTotalCount(deck) { return deck.cards.reduce((s,c) => s + c.count, 0); }

function getEventCount(deck) {
  return deck.cards.reduce((s, c) => {
    const card = cards.find(x => x.image_file === c.image_file);
    return s + (card && card.category === 'EVENT' ? c.count : 0);
  }, 0);
}

function getCardCountInDeck(image_file) {
  const deck = getCurrentDeck();
  if (!deck) return 0;
  const e = deck.cards.find(c => c.image_file === image_file);
  return e ? e.count : 0;
}

// 統一收斂點：任何會把一整份牌組寫進 decks 陣列的地方（新增卡片／頁面載入／
// 分享連結匯入／雲端同步下載／雲端覆蓋本機）都要呼叫這個函式，確保排序規則
// （角色卡優先、事件卡排最後，同類再依卡號排序，跟缺卡清單的 byCategoryThenCardNo
// 同一套規則）套用到所有資料入口，不要在個別入口各自補一次容易漏
function normalizeDeck(deck) {
  if (!deck || !Array.isArray(deck.cards)) return;
  deck.cards.sort((a, b) => {
    const ca = cards.find(c => c.image_file === a.image_file);
    const cb = cards.find(c => c.image_file === b.image_file);
    const aEvent = ca?.category === 'EVENT';
    const bEvent = cb?.category === 'EVENT';
    if (aEvent !== bEvent) return aEvent ? 1 : -1;
    return (a.card_no || '').localeCompare(b.card_no || '');
  });
}

// ── Add / Remove ───────────────────────────────────────
function addCardToDeck(image_file, quantity = 1) {
  if (!image_file) { showToast('錯誤：image_file 無效'); return; }
  if (!currentDeckId && decks.length === 0) createDeck('我的牌組1');
  const deck = getCurrentDeck();
  if (!deck) return;
  const currentTotal = getTotalCount(deck);
  const qty = quantity;
  const cardObj = cards.find(c => c.image_file === image_file);
  const entry = deck.cards.find(c => c.image_file === image_file);
  if (entry) entry.count += qty;
  else {
    deck.cards.push({ image_file, card_no: cardObj?.card_no || '', count: qty });
    normalizeDeck(deck);
  }
  saveDecks();
  refreshCardBadge(image_file);
  updateTray();
  const nm = cardObj ? cardObj.name : image_file;
  showToast(`＋${qty} ${nm}`);
}

function removeCardFromDeck(image_file) {
  const deck = getCurrentDeck();
  if (!deck) return;
  const idx = deck.cards.findIndex(c => c.image_file === image_file);
  if (idx === -1) return;
  const newCount = deck.cards[idx].count - 1;
  if (newCount <= 0) {
    clearCardColorMap(deck.id, image_file);
    deck.cards.splice(idx, 1);
  } else {
    trimCardColorMap(deck.id, image_file, newCount);
    deck.cards[idx].count = newCount;
  }
  saveDecks();
  refreshCardBadge(image_file);
  updateTray();
}

function refreshCardBadge(image_file) {
  const inp = document.getElementById(`input-${image_file}`);
  if (!inp) return;
  const n = getCardCountInDeck(image_file);
  inp.value = n > 0 ? n : '';
  inp.classList.toggle('has-count', n > 0);
}

  const evCnt  = getEventCount(deck);
  const warns  = [];

  warnEl.style.display = 'none';
}

function renderDeckSwitcher() {
  // tray 下拉選單：快速查詢固定置頂，其餘依名稱排序
  const traySel = document.getElementById('tray-deck-select');
  traySel.innerHTML = '';
  const sortedDecks = [...decks].sort((a, b) => {
    if (a.id === QUICK_DECK_ID) return -1;
    if (b.id === QUICK_DECK_ID) return 1;
    return a.name.localeCompare(b.name, 'zh-Hant');
  });
  sortedDecks.forEach(d => {
    const o = document.createElement('option');
    o.value = d.id; o.textContent = d.name; o.selected = d.id === currentDeckId;
    traySel.appendChild(o);
  });
  // 管理面板的改名欄位：使用者正在打字改名時（例如背景同步剛好觸發重繪），不要蓋掉輸入中的內容
  // ——但如果背景同步把「正在改名的那副牌組」本身換掉了（例如被雲端刪除、切去別副），
  // 輸入框對應的牌組已經不是同一副，這時就不算「使用者還在改名」，要強制更新，不然畫面跟資料對不起來
  const deck = getCurrentDeck();
  const nameInput = document.getElementById('deck-name-input');
  const editingSameDeck = document.activeElement === nameInput && nameInput.dataset.deckId === (deck && deck.id);
  if (deck && !editingSameDeck) nameInput.value = deck.name;
  if (deck) nameInput.dataset.deckId = deck.id;
  document.getElementById('tray-deck-select-label').textContent = deck ? deck.name : '';
}

function renderDeckPanel() {
  const deck = getCurrentDeck();
  const list = document.getElementById('deck-card-list');

  if (!deck || deck.cards.length === 0) {
    list.innerHTML = '<div class="deck-empty">牌組是空的，到卡片列表按「＋」加入卡片</div>';
    renderDeckStatsRow(deck || { cards: [] });
    return;
  }

  // ── 統計徽章列 ─────────────────────────────────────────────────────
  renderDeckStatsRow(deck);

  // ── 上色模式：交由 renderColorModeGrid 接管 body ──────────────────
  if (colorModeActive) {
    renderColorModeGrid();
    return;
  }

  // ── 縮圖格 ──────────────────────────────────────────────────────────
  const existingGrid = document.getElementById('deck-color-grid');
  if (existingGrid) existingGrid.remove();
  list.style.display = '';
  list.innerHTML = '';

  // 單卡呈現，不堆疊：每張複本各自一格；點擊顯示卡片資訊（非上色）
  // 數量徽章比照上色模式：只在同一張卡的最後一格顯示，可直接按±調整張數
  deck.cards.forEach(entry => {
    const card = cards.find(c => c.image_file === entry.image_file);
    if (!card) return;
    for (let i = 0; i < entry.count; i++) {
      const thumb = document.createElement('div');
      thumb.className = 'deck-thumb-item' + (entry.image_file === deckPreviewSelectedImg ? ' selected' : '');
      thumb.innerHTML = `<img src="images/${entry.image_file}" alt="" onerror="this.style.background='var(--surface2)'">`;
      thumb.addEventListener('click', () => showDeckPreview(entry.image_file));

      if (i === entry.count - 1) {
        const badge = document.createElement('div');
        badge.className = 'color-qty-badge';
        badge.innerHTML = `
          <button class="color-qty-btn" data-dir="-1" data-img="${entry.image_file}" ${entry.count <= 1 ? 'disabled' : ''}>－</button>
          <span class="color-qty-num">${entry.count}</span>
          <button class="color-qty-btn" data-dir="1"  data-img="${entry.image_file}">＋</button>
        `;
        badge.querySelectorAll('.color-qty-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            _colorModeAdjustCount(btn.dataset.img, parseInt(btn.dataset.dir));
          });
        });
        thumb.appendChild(badge);
      }

      list.appendChild(thumb);
    }
  });

  // 若 preview 選中的卡已不在牌組，隱藏 preview
  if (deckPreviewSelectedImg && !deck.cards.find(c => c.image_file === deckPreviewSelectedImg)) {
    hideDeckPreview();
  }
}

// ── Analysis (PR #3) ───────────────────────────────────
function openAnalysis() {
  const deck = getCurrentDeck();
  if (!deck || deck.cards.length === 0) { showToast('牌組是空的！'); return; }
  renderAnalysis();
  document.getElementById('analysis-overlay').classList.add('open');
}
function closeAnalysis() { document.getElementById('analysis-overlay').classList.remove('open'); }

function renderAnalysis() {
  const deck = getCurrentDeck();
  if (!deck) return;
  document.getElementById('analysis-title').textContent = `缺卡清單 — ${deck.name}`;

  // 缺牌數 = Σ max(0, 牌組需要 − 此牌組的持有數)
  const total = getTotalCount(deck);
  const owned = getDeckOwned();   // 此牌組專屬持有資料（以 image_file 為 key）
  let missing = 0;
  deck.cards.forEach(e => {
    missing += Math.max(0, e.count - (owned[e.image_file] || 0));
  });
  document.getElementById('analysis-total').textContent   = total;
  document.getElementById('analysis-missing').textContent = missing;
  document.getElementById('analysis-owned').textContent   = total - missing;

  const body = document.getElementById('analysis-body');
  body.innerHTML = '';

  // 先算出每張卡的 deficit，再排序
  const entries = deck.cards.map(entry => {
    const card = cards.find(c => c.image_file === entry.image_file);
    if (!card) return null;
    const have    = owned[entry.image_file] || 0;
    const need    = entry.count;
    const deficit = Math.max(0, need - have);
    return { entry, card, have, need, deficit };
  }).filter(Boolean);

  // 排序方式跟牌組管理一致：角色卡優先、事件卡排最後，同類再依卡號排序
  // （未完成/已完成的分組仍保留，只是各自內部改用這個排序，不再用缺牌數排）
  const byCategoryThenCardNo = (a, b) => {
    const aEvent = a.card.category === 'EVENT';
    const bEvent = b.card.category === 'EVENT';
    if (aEvent !== bEvent) return aEvent ? 1 : -1;
    return (a.card.card_no || '').localeCompare(b.card.card_no || '');
  };
  const incomplete = entries.filter(e => e.deficit > 0).sort(byCategoryThenCardNo);
  const complete   = entries.filter(e => e.deficit === 0).sort(byCategoryThenCardNo);
  const totalEntries = entries.length;

  // 「未完成」標題拿掉了（右上角已有準確的「缺N張」總數，不需要重複）。
  // 「已完成」標題保留，格式改成「已完成（幾/總數）」，點擊時即時更新。
  const ensureCompleteHeader = () => {
    let h = document.querySelector('.analysis-section-header[data-section="complete"]');
    if (!h) {
      h = document.createElement('div');
      h.className = 'analysis-section-header';
      h.dataset.section = 'complete';
      body.appendChild(h);
    }
    return h;
  };
  const updateCompleteHeader = () => {
    let completeN = 0;
    deck.cards.forEach(en => {
      const deficit = Math.max(0, en.count - (deck.owned[en.image_file] || 0));
      if (deficit === 0) completeN++;
    });
    const h = document.querySelector('.analysis-section-header[data-section="complete"]');
    if (h) h.textContent = `已完成（${completeN}/${totalEntries}）`;
  };

  const renderSection = (list) => {
    list.forEach(({ entry, card, need, deficit }) => {
      const imgSrc = card.image_file ? `images/${card.image_file}` : '';
      const variant = getVariantCode(entry.image_file);
      const displayName = (card.card_no || '') + (variant ? `-${variant}` : '');

      // 不顯示卡號文字（改用 title 滑鼠 hover 提示），也不再把同卡複本包成一組，
      // 直接攤平成固定 8 欄網格裡各自獨立的格子（跟 GPT-5.5 討論定案，見上方 CSS 註解）。
      // 每一格各自記自己是否持有，點哪一格就切換哪一格 —— 不能用「從左邊算 have 張填滿」
      // 這種算法，不然點到後面那格時，畫面卻是點亮最前面那格，看起來像點錯卡。
      const have0 = Math.min(need, deck.owned[entry.image_file] || 0);
      const tileOwned = Array.from({ length: need }, (_, i) => i < have0);
      const tiles = [];
      let wasComplete = deficit === 0;

      for (let i = 0; i < need; i++) {
        const tile = document.createElement('div');
        tile.title = displayName;
        tile.className = `an-tile ${tileOwned[i] ? 'owned' : 'not-owned'}`;
        tile.innerHTML = `<img class="an-tile-img" src="${imgSrc}" alt="" onerror="this.style.background='var(--surface2)'">`;
        tile.addEventListener('click', () => {
          tileOwned[i] = !tileOwned[i];
          tile.className = `an-tile ${tileOwned[i] ? 'owned' : 'not-owned'}`;
          const haveNow = tileOwned.filter(Boolean).length;
          deck.owned[entry.image_file] = haveNow;
          saveDecks();

          // 這張卡剛好在這次點擊湊滿／被取消湊滿 → 整組（該卡所有格子）搬到「已完成」／搬回去，
          // 只搬動這一張卡自己的格子，不動其他卡的排序，避免整頁跳動
          const isCompleteNow = haveNow >= need;
          if (isCompleteNow !== wasComplete) {
            if (isCompleteNow) {
              ensureCompleteHeader();
              tiles.forEach(t => body.appendChild(t));
            } else {
              const h = document.querySelector('.analysis-section-header[data-section="complete"]');
              if (h) tiles.forEach(t => body.insertBefore(t, h));
            }
            wasComplete = isCompleteNow;
          }

          let missing2 = 0;
          deck.cards.forEach(en => { missing2 += Math.max(0, en.count - (deck.owned[en.image_file] || 0)); });
          document.getElementById('analysis-missing').textContent = missing2;
          document.getElementById('analysis-owned').textContent = total - missing2;
          updateCompleteHeader();
        });
        tiles.push(tile);
        body.appendChild(tile);
      }
    });
  };

  renderSection(incomplete);
  if (complete.length > 0) ensureCompleteHeader();
  renderSection(complete);
  updateCompleteHeader();
}

// ══════════════════════════════════════════════════════
// PNG 圖片匯出 / 匯入
// ══════════════════════════════════════════════════════

const PNG_KEYWORD = 'HVBreakDeck';

// CRC32 查表（PNG chunk 必需）
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c;
  }
  return t;
})();

function crc32(buf) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) crc = CRC32_TABLE[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// 把 tEXt chunk 注入 PNG bytes（插在第一個 IDAT 之前）
function injectPngChunk(pngBytes, keyword, text) {
  const enc = new TextEncoder();
  const kw  = enc.encode(keyword);
  const tx  = enc.encode(text);
  const data = new Uint8Array(kw.length + 1 + tx.length);
  data.set(kw); data[kw.length] = 0; data.set(tx, kw.length + 1);

  const typeArr = new Uint8Array([116,69,88,116]); // 'tEXt'
  const crcIn   = new Uint8Array(4 + data.length);
  crcIn.set(typeArr); crcIn.set(data, 4);
  const crcVal  = crc32(crcIn);

  const chunk = new Uint8Array(12 + data.length);
  const dv    = new DataView(chunk.buffer);
  dv.setUint32(0, data.length, false);
  chunk.set(typeArr, 4);
  chunk.set(data, 8);
  dv.setUint32(8 + data.length, crcVal, false);

  // 找 IDAT 位置
  let pos = 8;
  while (pos + 8 <= pngBytes.length) {
    const len  = new DataView(pngBytes.buffer, pngBytes.byteOffset + pos).getUint32(0, false);
    const type = String.fromCharCode(pngBytes[pos+4], pngBytes[pos+5], pngBytes[pos+6], pngBytes[pos+7]);
    if (type === 'IDAT') break;
    pos += 12 + len;
  }

  const out = new Uint8Array(pngBytes.length + chunk.length);
  out.set(pngBytes.slice(0, pos));
  out.set(chunk, pos);
  out.set(pngBytes.slice(pos), pos + chunk.length);
  return out;
}

// 從 PNG bytes 讀取我們的 tEXt chunk
function readPngChunk(pngBytes, keyword) {
  const dec = new TextDecoder();
  let pos = 8;
  while (pos + 8 <= pngBytes.length) {
    const dv   = new DataView(pngBytes.buffer, pngBytes.byteOffset + pos);
    const len  = dv.getUint32(0, false);
    const type = String.fromCharCode(pngBytes[pos+4], pngBytes[pos+5], pngBytes[pos+6], pngBytes[pos+7]);
    if (type === 'IEND') break;
    if (type === 'tEXt' && pos + 8 + len <= pngBytes.length) {
      const data = pngBytes.slice(pos + 8, pos + 8 + len);
      const sep  = data.indexOf(0);
      if (sep !== -1 && dec.decode(data.slice(0, sep)) === keyword) {
        return dec.decode(data.slice(sep + 1));
      }
    }
    pos += 12 + len;
  }
  return null;
}

// 圓角矩形輔助（相容舊瀏覽器）
function canvasRoundRect(ctx, x, y, w, h, r) {
  const [tl, tr, br, bl] = typeof r === 'number' ? [r,r,r,r] : r;
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);   ctx.quadraticCurveTo(x+w, y,   x+w, y+tr);
  ctx.lineTo(x + w, y + h - br); ctx.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
  ctx.lineTo(x + bl, y + h);   ctx.quadraticCurveTo(x,   y+h, x,   y+h-bl);
  ctx.lineTo(x, y + tl);       ctx.quadraticCurveTo(x,   y,   x+tl, y);
  ctx.closePath();
}

// 畫牌組 Canvas（高解析度）
async function drawDeckCanvas(deck) {
  const SCALE  = 3;          // 3x 高解析度
  const entries = expandEntriesForCanvasGrouped(deck);

  // 欄數：≤8張用實際張數寬度，>8張固定8欄
  const COLS   = Math.min(8, entries.length);

  const CARD_W = 100;        // 邏輯尺寸（實際 ×SCALE）
  const CARD_H = 140;
  const GAP    = 10;
  const PAD    = 20;
  const HEAD_H = 56;         // 兩列：品牌名 + 牌組名/統計合併列
  const FOOT_H = 34;

  const rows = Math.ceil(entries.length / COLS);
  const W    = PAD*2 + COLS*(CARD_W+GAP) - GAP;
  const H    = HEAD_H + PAD + rows*(CARD_H+GAP) - GAP + PAD + FOOT_H;

  const canvas  = document.createElement('canvas');
  canvas.width  = W * SCALE;
  canvas.height = H * SCALE;
  const ctx     = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);               // 之後所有座標用邏輯尺寸即可
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // 背景
  ctx.fillStyle = '#FAFAFA';
  ctx.fillRect(0, 0, W, H);

  // 標題列
  ctx.fillStyle = '#F3EFEA';
  ctx.fillRect(0, 0, W, HEAD_H);
  ctx.fillStyle = '#BE520B';
  ctx.fillRect(0, HEAD_H - 2, W, 2);

  // 第一列：品牌名（左）
  ctx.font = 'bold 15px "Segoe UI","Noto Sans TC",sans-serif';
  ctx.fillStyle = '#BE520B';
  ctx.textAlign = 'left';
  ctx.fillText('排球少年!! バボカ!!BREAK', PAD, 22);

  // 第二列：牌組名（左）+ 統計＋共N張（右）
  const ROW2_Y = 44;
  ctx.font = 'bold 17px "Segoe UI","Noto Sans TC",sans-serif';
  ctx.fillStyle = '#0D0506';
  ctx.textAlign = 'left';
  ctx.fillText(deck.name, PAD, ROW2_Y);

  // 右側：先量「共 N 張」寬度，再左推統計列
  const totalTxt = `共 ${getTotalCount(deck)} 張`;
  ctx.font = '11px "Segoe UI",sans-serif';
  const totalTxtW = ctx.measureText(totalTxt).width;

  const colorStats = getColorStats(deck);
  const evCnt = getEventCount(deck);
  const statsItems = [
    ...COLOR_TAGS.map(({ key, label, hex }) => ({ label, hex, val: String(colorStats[key]) })),
    { label: '事件', hex: EVENT_COLOR_HEX, val: `${evCnt}/8` },
  ];
  const DOT_R    = 3.5;
  const ITEM_GAP = 10;
  const STATS_TOTAL_GAP = 8; // 統計列與「共 N 張」之間距

  ctx.font = '10px "Segoe UI","Noto Sans TC",sans-serif';
  // 量出所有 stats 總寬
  const statsWidths = statsItems.map(({ label, val }) => {
    const txt = `${label} ${val}`;
    return DOT_R * 2 + 4 + ctx.measureText(txt).width;
  });
  const totalStatsW = statsWidths.reduce((s, w) => s + w, 0) + ITEM_GAP * (statsItems.length - 1);

  // 統計列起始 X（由右往左算：PAD + totalTxtW + gap + totalStatsW）
  let sx = W - PAD - totalTxtW - STATS_TOTAL_GAP - totalStatsW;
  for (let i = 0; i < statsItems.length; i++) {
    const { label, hex, val } = statsItems[i];
    ctx.beginPath();
    ctx.arc(sx + DOT_R, ROW2_Y - DOT_R - 1, DOT_R, 0, Math.PI * 2);
    ctx.fillStyle = hex;
    ctx.fill();
    sx += DOT_R * 2 + 4;
    const txt = `${label} ${val}`;
    ctx.fillStyle = '#6B6B6B';
    ctx.textAlign = 'left';
    ctx.fillText(txt, sx, ROW2_Y);
    sx += statsWidths[i] - (DOT_R * 2 + 4) + ITEM_GAP;
  }

  // 「共 N 張」最右
  ctx.font = '11px "Segoe UI",sans-serif';
  ctx.fillStyle = '#6B6B6B';
  ctx.textAlign = 'right';
  ctx.fillText(totalTxt, W - PAD, ROW2_Y);
  ctx.textAlign = 'left';

  // 載入圖片（快取避免重複請求）
  const imgCache = {};
  const loadImg  = src => {
    if (imgCache[src]) return imgCache[src];
    imgCache[src] = new Promise(res => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload  = () => res(img);
      img.onerror = () => res(null);
      img.src = src;
    });
    return imgCache[src];
  };

  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i];
    const card  = cards.find(c => c.image_file === entry.image_file);
    if (!card) continue;

    const col = i % COLS;
    const row = Math.floor(i / COLS);
    const x   = PAD + col * (CARD_W + GAP);
    const y   = HEAD_H + PAD + row * (CARD_H + GAP);

    // 卡片底色
    ctx.fillStyle = '#FFFFFF';
    canvasRoundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.fill();

    // 卡片圖片
    if (card.image_file) {
      const img = await loadImg(`images/${card.image_file}`);
      if (img) {
        ctx.save();
        canvasRoundRect(ctx, x, y, CARD_W, CARD_H, 7); ctx.clip();
        ctx.drawImage(img, x, y, CARD_W, CARD_H);
        ctx.restore();
      }
    }

    // 底部漸層＋卡名
    const grad = ctx.createLinearGradient(x, y + CARD_H - 36, x, y + CARD_H);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = grad;
    canvasRoundRect(ctx, x, y + CARD_H - 36, CARD_W, 36, [0,0,7,7]); ctx.fill();

    ctx.font = '10px "Segoe UI","Noto Sans TC",sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    const variant = getVariantCode(entry.image_file);
    const nm = (card.card_no || '') + (variant ? `-${variant}` : '');
    ctx.fillText(nm, x + CARD_W/2, y + CARD_H - 8);
    ctx.textAlign = 'left';

    // 數量徽章（>1 才顯示）
    if (entry.count > 1) {
      const bw = 22, bh = 17;
      ctx.fillStyle = 'rgba(190,82,11,0.92)';
      canvasRoundRect(ctx, x + CARD_W - bw - 4, y + 4, bw, bh, 5); ctx.fill();
      ctx.font = 'bold 11px "Segoe UI",sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(`×${entry.count}`, x + CARD_W - bw/2 - 4, y + 15);
      ctx.textAlign = 'left';
    }

    // 顏色外框
    if (entry.borderColor) {
      const brd = 3;
      ctx.strokeStyle = entry.borderColor;
      ctx.lineWidth = brd;
      canvasRoundRect(ctx, x + brd/2, y + brd/2, CARD_W - brd, CARD_H - brd, 5.5);
      ctx.stroke();
    }
  }

  // 頁尾
  ctx.fillStyle = '#E2DCD3';
  ctx.fillRect(0, H - FOOT_H, W, 1);
  ctx.font = '10px "Segoe UI",sans-serif';
  ctx.fillStyle = '#6B6B6B';
  ctx.textAlign = 'center';
  ctx.fillText(
    `weilun2022.github.io/haikyuu-cards  ·  ${new Date().toLocaleDateString('zh-TW')}`,
    W/2, H - 11
  );
  ctx.textAlign = 'left';

  return canvas;
}

// 匯出圖片（PNG + 嵌入牌組資料）
async function exportDeckAsImage() {
  const deck = getCurrentDeck();
  if (!deck || deck.cards.length === 0) { showToast('牌組是空的！'); return; }

  const total  = getTotalCount(deck);
  const evCnt  = getEventCount(deck);
  const errors = [];
  if (total > 40)          errors.push(`總張數 ${total} 張（上限 40）`);
  if (evCnt > MAX_EVENT)   errors.push(`事件卡 ${evCnt} 張（上限 8）`);
  if (errors.length) { showToast(`⚠️ 無法輸出：${errors.join('　')}`); return; }

  showToast('圖片生成中...');
  try {
    const canvas  = await drawDeckCanvas(deck);
    const dataUrl = canvas.toDataURL('image/png');
    const bin     = atob(dataUrl.split(',')[1]);
    const bytes   = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const payload  = JSON.stringify({ name: deck.name, cards: deck.cards, colors: deckColorState[deck.id] || {} });
    const injected = injectPngChunk(bytes, PNG_KEYWORD, payload);

    const blob = new Blob([injected], { type: 'image/png' });
    const url  = URL.createObjectURL(blob);
    const safe = deck.name.replace(/[^\w\u4e00-\u9fff\-]/g, '_');
    Object.assign(document.createElement('a'), {
      href: url,
      download: `HVBreak-${safe}-${new Date().toISOString().slice(0,19).replace('T','-').replace(/:/g,'')}.png`
    }).click();
    URL.revokeObjectURL(url);
    showToast('圖片已下載！');
  } catch(e) {
    console.error(e);
    showToast('圖片生成失敗，請確認主控台訊息');
  }
}

// 從圖片匯入牌組
async function importDeckFromImage(file) {
  try {
    const buf      = await file.arrayBuffer();
    const bytes    = new Uint8Array(buf);
    const SIG      = [137,80,78,71,13,10,26,10];
    const validPng = SIG.every((b,i) => bytes[i] === b);
    if (!validPng) { showToast('不是有效的 PNG 圖片'); return; }

    const text = readPngChunk(bytes, PNG_KEYWORD);
    if (!text) { showToast('此圖片不含牌組資料'); return; }

    const data = JSON.parse(text);
    if (!Array.isArray(data.cards)) { showToast('牌組資料格式錯誤'); return; }

    const newDeck = { id: makeDeckId(), name: data.name || '匯入的牌組', cards: data.cards, owned: {} };
    decks.push(newDeck);
    currentDeckId = newDeck.id;
    saveDecks();
    if (data.colors && typeof data.colors === 'object') {
      deckColorState[newDeck.id] = data.colors;
      saveColorState();
    }
    renderDeckSwitcher(); renderDeckPanel(); updateTray(); renderGrid();
    showToast(`已匯入「${newDeck.name}」！`);
  } catch(e) {
    console.error(e);
    showToast('匯入失敗');
  }
}

// ── Variant Code Helper ─────────────────────────────────
// 從 image_file 萃取變體碼，例如 HV-P01-004-KP.webp → "KP"
// 若最後片段是純數字（非特殊版本）就回傳空字串
function getVariantCode(image_file) {
  if (!image_file) return '';
  const m = image_file.match(/-([^-]+)\.webp$/i);
  if (!m) return '';
  const code = m[1];
  return /^\d+$/.test(code) ? '' : code;  // 純數字表示無特殊版本
}

// ── Color Mode ──────────────────────────────────────────
function buildColorModeSlots() {
  const deck = getCurrentDeck();
  if (!deck) return [];
  const slots = [];
  for (const entry of deck.cards) {
    const card = cards.find(c => c.image_file === entry.image_file);
    const isEvent = card && card.category === 'EVENT';
    const colorMap = isEvent ? null : getCardColorMap(deck.id, entry.image_file);
    const slotColors = Array(entry.count).fill(null);
    if (isEvent) {
      slotColors.fill('event');
    } else if (colorMap) {
      let idx = 0;
      for (const { key } of COLOR_TAGS) {
        const cnt = colorMap[key] || 0;
        for (let i = 0; i < cnt && idx < slotColors.length; i++) slotColors[idx++] = key;
      }
    }
    for (let i = 0; i < entry.count; i++)
      slots.push({ imageFile: entry.image_file, slotIndex: i, color: slotColors[i], isEvent });
  }
  // 主鍵：顏色分組（無色排在一般顏色後、事件牌前；事件牌永遠排最後）；次鍵：依 colorModeSortKey
  const SLOT_COLOR_ORD = { free: 0, receive: 1, set: 2, attack: 3, event: 5 };
  const RARITY_ORD = { NP:0, N:1, R:2, RP:3, S:4, SP:5, 極:6, '極P':7, 頂:8, '頂P':9, 秘:10 };
  slots.sort((a, b) => {
    const aO = a.color !== null ? (SLOT_COLOR_ORD[a.color] ?? 4) : 4;
    const bO = b.color !== null ? (SLOT_COLOR_ORD[b.color] ?? 4) : 4;
    if (aO !== bO) return aO - bO;
    const ca = cards.find(x => x.image_file === a.imageFile);
    const cb = cards.find(x => x.image_file === b.imageFile);
    const sk = colorModeSortKey;
    if (sk === 'rarity') {
      const ra = RARITY_ORD[ca && ca.rarity] ?? 99;
      const rb = RARITY_ORD[cb && cb.rarity] ?? 99;
      if (ra !== rb) return rb - ra;
    } else if (sk !== 'card_no') {
      const av = (ca && ca[sk]) ?? -1;
      const bv = (cb && cb[sk]) ?? -1;
      if (av !== bv) return bv - av;
    }
    return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
  });
  return slots;
}

function renderColorModeGrid() {
  const list = document.getElementById('deck-card-list');
  list.style.display = 'none';

  let grid = document.getElementById('deck-color-grid');
  if (!grid) {
    grid = document.createElement('div');
    grid.id = 'deck-color-grid';
    grid.className = 'color-mode-grid';
    list.parentNode.insertBefore(grid, list.nextSibling);
  }
  grid.innerHTML = '';

  // Pre-compute last index for each imageFile (where the ±N badge goes)
  const lastIdxFor = {};
  colorModeSlots.forEach((slot, idx) => { lastIdxFor[slot.imageFile] = idx; });

  // Current count per imageFile from deck
  const deck = getCurrentDeck();
  const countFor = {};
  if (deck) deck.cards.forEach(e => { countFor[e.image_file] = e.count; });

  colorModeSlots.forEach((slot, idx) => {
    const thumb = document.createElement('div');
    const colorClass = slot.color ? `c-${slot.color}` : '';
    thumb.className = ['color-mode-thumb', colorClass,
      colorModeSelectedIndices.has(idx) ? 'selected' : ''].filter(Boolean).join(' ');
    thumb.innerHTML = `<img src="images/${slot.imageFile}" alt="" onerror="this.style.background='var(--border)'">`;

    if (!slot.isEvent) {
      thumb.addEventListener('click', () => {
        if (colorModeSelectedIndices.has(idx)) {
          colorModeSelectedIndices.delete(idx);
          thumb.classList.remove('selected');
        } else {
          colorModeSelectedIndices.add(idx);
          thumb.classList.add('selected');
        }
        document.getElementById('color-pick-count').textContent = `已選 ${colorModeSelectedIndices.size} 張`;
      });
    }

    // Badge on last slot of each imageFile
    if (!slot.isEvent && idx === lastIdxFor[slot.imageFile] && deck) {
      const cnt = countFor[slot.imageFile] || 1;
      const badge = document.createElement('div');
      badge.className = 'color-qty-badge';
      badge.innerHTML = `
        <button class="color-qty-btn" data-dir="-1" data-img="${slot.imageFile}" ${cnt <= 1 ? 'disabled' : ''}>－</button>
        <span class="color-qty-num">${cnt}</span>
        <button class="color-qty-btn" data-dir="1"  data-img="${slot.imageFile}">＋</button>
      `;
      badge.querySelectorAll('.color-qty-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation(); // don't trigger thumb select
          _colorModeAdjustCount(btn.dataset.img, parseInt(btn.dataset.dir));
        });
      });
      thumb.appendChild(badge);
    }

    grid.appendChild(thumb);
  });
}

function _colorModeAdjustCount(imageFile, dir) {
  const deck = getCurrentDeck();
  if (!deck) return;
  const entry = deck.cards.find(e => e.image_file === imageFile);
  if (!entry) return;
  const newCount = Math.max(1, entry.count + dir);
  if (newCount === entry.count) return;
  trimCardColorMap(deck.id, imageFile, newCount);
  entry.count = newCount;
  saveDecks();
  // 若卡片資訊預覽面板正開著同一張卡，同步更新它顯示的張數（避免跟格子上的±徽章顯示不一致）
  if (deckPreviewSelectedImg === imageFile) {
    const previewCountEl = document.getElementById('deck-preview-count');
    if (previewCountEl) previewCountEl.textContent = newCount;
  }
  if (colorModeActive) {
    // Rebuild slots (preserve color assignments that still fit)
    colorModeSlots = buildColorModeSlots();
    // Clear selected indices that may now be out of range
    colorModeSelectedIndices.clear();
    document.getElementById('color-pick-count').textContent = '已選 0 張';
    renderColorModeGrid();
  } else {
    renderDeckPanel();
  }
  renderDeckStatsRow(deck);
  updateTray();
}

function toggleColorMode() {
  colorModeActive = !colorModeActive;
  if (colorModeActive) {
    colorModeSlots = buildColorModeSlots();
    colorModeSelectedIndices.clear();
  } else {
    colorModeSlots = [];
    colorModeSelectedIndices.clear();
  }
  const btn = document.getElementById('deck-color-mode-btn');
  btn.textContent = colorModeActive ? '✕ 結束上色' : '🎨 上色';
  btn.classList.toggle('active', colorModeActive);
  document.getElementById('deck-color-picker-bar').classList.toggle('show', colorModeActive);
  document.getElementById('deck-panel').classList.toggle('color-mode-open', colorModeActive);
  document.getElementById('color-pick-count').textContent = '已選 0 張';
  renderDeckPanel();
}

function applyBatchColor(colorKey) {
  if (colorModeSelectedIndices.size === 0) { showToast('請先選取卡片'); return; }
  const deck = getCurrentDeck();
  if (!deck) return;

  // 套用顏色至選取的 slot
  for (const idx of colorModeSelectedIndices) {
    const slot = colorModeSlots[idx];
    if (!slot || slot.isEvent) continue;
    slot.color = colorKey || null;
  }
  colorModeSelectedIndices.clear();

  // 從 slots 重新計算每張卡的 colorMap
  const cardSlotColors = {};
  for (const slot of colorModeSlots) {
    if (slot.isEvent) continue;
    if (!cardSlotColors[slot.imageFile]) cardSlotColors[slot.imageFile] = [];
    cardSlotColors[slot.imageFile].push(slot.color);
  }
  for (const [imgFile, slotColors] of Object.entries(cardSlotColors)) {
    const colorMap = {};
    for (const { key } of COLOR_TAGS) colorMap[key] = 0;
    let hasColor = false;
    for (const c of slotColors) {
      if (c && colorMap[c] !== undefined) { colorMap[c]++; hasColor = true; }
    }
    if (hasColor) setCardColorMap(deck.id, imgFile, colorMap);
    else clearCardColorMap(deck.id, imgFile);
  }
  saveDecks();

  // 套色後依顏色 + 卡號排序（多數決：數量最多的色決定排序位置；事件牌永遠排最後）
  function getColorOrder(entry) {
    const c = cards.find(x => x.image_file === entry.image_file);
    if (!c) return 99;
    if (c.category === 'EVENT') return COLOR_TAGS.length + 1;
    const cm = getCardColorMap(deck.id, entry.image_file);
    if (!cm) return COLOR_TAGS.length;
    let maxCnt = 0, maxIdx = COLOR_TAGS.length;
    for (let i = 0; i < COLOR_TAGS.length; i++) {
      const cnt = cm[COLOR_TAGS[i].key] || 0;
      if (cnt > maxCnt) { maxCnt = cnt; maxIdx = i; }
    }
    return maxIdx;
  }
  deck.cards.sort((a, b) => {
    const diff = getColorOrder(a) - getColorOrder(b);
    if (diff !== 0) return diff;
    const ca = cards.find(x => x.image_file === a.image_file);
    const cb = cards.find(x => x.image_file === b.image_file);
    return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
  });
  saveDecks();
  colorModeSlots = buildColorModeSlots();

  // 更新統計列
  renderDeckStatsRow(deck);

  document.getElementById('color-pick-count').textContent = '已選 0 張';
  renderColorModeGrid();
}

// ── Reorganize Deck ─────────────────────────────────────
const RARITY_SORT_ORDER = { '秘':0, '頂P':1, '頂':2, 'S':3, 'R':4, 'N':5, 'D':6, 'P':7 };

function reorganizeDeck(mode) {
  const deck = getCurrentDeck();
  if (!deck || deck.cards.length === 0) return;

  function getCard(entry) { return cards.find(c => c.image_file === entry.image_file); }

  function getColorOrder(entry) {
    const card = getCard(entry);
    if (!card) return 99;
    if (card.category === 'EVENT') return COLOR_TAGS.length + 1;
    const colorMap = getCardColorMap(deck.id, entry.image_file);
    if (!colorMap) return COLOR_TAGS.length;
    let maxCnt = 0, maxIdx = COLOR_TAGS.length;
    for (let i = 0; i < COLOR_TAGS.length; i++) {
      const cnt = colorMap[COLOR_TAGS[i].key] || 0;
      if (cnt > maxCnt) { maxCnt = cnt; maxIdx = i; }
    }
    return maxIdx;
  }

  const TOAST = { color:'已依顏色整理', srv:'已依發球值整理', blk:'已依攔網值整理',
                  rcv:'已依接球值整理', tos:'已依舉球值整理', atk:'已依攻擊值整理',
                  card_no:'已依卡號整理', rarity:'已依稀有度整理' };

  deck.cards.sort((a, b) => {
    const ca = getCard(a), cb = getCard(b);
    if (mode === 'color') {
      const diff = getColorOrder(a) - getColorOrder(b);
      if (diff !== 0) return diff;
      return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
    }
    if (mode === 'card_no') {
      return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
    }
    if (mode === 'rarity') {
      const ra = RARITY_SORT_ORDER[ca && ca.rarity] ?? 99;
      const rb = RARITY_SORT_ORDER[cb && cb.rarity] ?? 99;
      if (ra !== rb) return ra - rb;
      return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
    }
    // 數值排序：srv / blk / tos / atk — 事件牌沒有數值排最後
    const av = (ca && ca[mode]) ?? -1;
    const bv = (cb && cb[mode]) ?? -1;
    if (av !== bv) return bv - av;
    return ((ca && ca.card_no) || '').localeCompare((cb && cb.card_no) || '');
  });

  saveDecks();
  renderDeckPanel();
  showToast(TOAST[mode] || '已整理');
}

// ── Bind Deck Events ────────────────────────────────────
function bindDeckEvents() {
  document.getElementById('tray-open-btn').addEventListener('click', openDeckPanel);
  document.getElementById('tray-analysis-btn').addEventListener('click', openAnalysis);

  document.getElementById('deck-footer-toggle').addEventListener('click', () => {
    const toggle = document.getElementById('deck-footer-toggle');
    const footer = document.getElementById('deck-panel-footer');
    const open = toggle.classList.toggle('open');
    footer.classList.toggle('open', open);
    // 工具列展開後內容變高（含雲端同步按鈕），跟上色模式一樣給整個面板更多高度，
    // 不然手機上 60vh 塞不下，會卡在看不到、也捲不到最下面幾顆按鈕
    document.getElementById('deck-panel').classList.toggle('footer-open', open);
  });

  document.getElementById('deck-panel-close').addEventListener('click', closeDeckPanel);
  document.getElementById('deck-panel-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('deck-panel-overlay')) closeDeckPanel();
  });

  // ── PREVIEW 按鈕 ──────────────────────────────────────
  document.getElementById('deck-preview-img').addEventListener('click', () => {
    if (!deckPreviewSelectedImg) return;
    const card = cards.find(c => c.image_file === deckPreviewSelectedImg);
    if (card) openModal(card);
  });
  document.getElementById('deck-preview-close').addEventListener('click', hideDeckPreview);
  document.getElementById('deck-preview-inc').addEventListener('click', () => {
    if (!deckPreviewSelectedImg) return;
    addCardToDeck(deckPreviewSelectedImg, 1);
    updateTray(); renderDeckPanel();
    document.getElementById('deck-preview-count').textContent =
      getCurrentDeck()?.cards.find(c => c.image_file === deckPreviewSelectedImg)?.count ?? '';
  });
  document.getElementById('deck-preview-dec').addEventListener('click', () => {
    if (!deckPreviewSelectedImg) return;
    const deck = getCurrentDeck();
    const entry = deck?.cards.find(c => c.image_file === deckPreviewSelectedImg);
    if (!entry) return;
    if (entry.count > 1) {
      removeCardFromDeck(deckPreviewSelectedImg);
      updateTray(); renderDeckPanel();
      document.getElementById('deck-preview-count').textContent =
        getCurrentDeck()?.cards.find(c => c.image_file === deckPreviewSelectedImg)?.count ?? '';
    }
  });
  document.getElementById('deck-preview-remove').addEventListener('click', () => {
    if (!deckPreviewSelectedImg) return;
    const deck = getCurrentDeck();
    if (!deck) return;
    const entry = deck.cards.find(c => c.image_file === deckPreviewSelectedImg);
    if (!entry) return;
    deck.cards = deck.cards.filter(c => c.image_file !== deckPreviewSelectedImg);
    trimCardColorMap(deck.id, deckPreviewSelectedImg, 0);
    saveDecks();
    refreshCardBadge(deckPreviewSelectedImg);
    hideDeckPreview();
    updateTray(); renderGrid();
  });

  document.getElementById('tray-deck-select').addEventListener('change', e => {
    currentDeckId = e.target.value;
    const deck = getCurrentDeck();
    if (deck) document.getElementById('deck-name-input').value = deck.name;
    renderDeckPanel(); updateTray(); renderGrid();
  });

  document.getElementById('deck-rename-btn').addEventListener('click', () => {
    const deck = getCurrentDeck(); if (!deck) return;
    if (deck.id === QUICK_DECK_ID) {
      const name = document.getElementById('deck-name-input').value.trim();
      if (!name) { showToast('請輸入牌組名稱'); return; }
      const newDeck = createDeck(name);
      newDeck.cards = deck.cards.map(c => ({ ...c }));
      deck.cards = [];
      saveDecks(); renderDeckSwitcher(); renderDeckPanel(); updateTray(); renderGrid();
      showToast(`已另存為「${name}」並清空快速查詢`);
      return;
    }
    const name = document.getElementById('deck-name-input').value.trim();
    if (!name) return;
    deck.name = name; saveDecks(); updateTray(); renderDeckSwitcher(); showToast('已重新命名！');
  });
  document.getElementById('deck-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('deck-rename-btn').click();
  });

  document.getElementById('deck-new-btn').addEventListener('click', () => {
    createDeck(`我的牌組${decks.length + 1}`);
    renderDeckSwitcher(); renderDeckPanel(); updateTray(); renderGrid();
  });

  document.getElementById('deck-duplicate-btn').addEventListener('click', duplicateDeck);

  document.getElementById('deck-delete-btn').addEventListener('click', () => {
    const deck = getCurrentDeck(); if (!deck) return;
    if (deck.id === QUICK_DECK_ID) { showToast('快速查詢牌組不可刪除'); return; }
    const cloudWarning = window.hvCloudSync?.currentUser
      ? '\n\n（雲端備份不會馬上被刪除，要等你下次按「立即同步」才會真的移除；在那之前如果反悔，可以用「用雲端覆蓋本機」找回來。）'
      : '';
    if (!confirm(`確定要刪除「${deck.name}」嗎？${cloudWarning}`)) return;
    if (decks.length <= 1) {
      const userForClear = window.hvCloudSync?.currentUser;
      if (userForClear) window.hvCloudSync.markRisky(userForClear.uid, deck.id);
      deck.cards = []; delete deckColorState[deck.id]; saveColorState(); saveDecks(); renderDeckPanel(); updateTray(); renderGrid();
      showToast('牌組已清空'); return;
    }
    const idx = decks.findIndex(d => d.id === currentDeckId);
    const user = window.hvCloudSync?.currentUser;
    if (user) window.hvCloudSync.queuePendingDelete(user.uid, deck.id); // 明確刪除事件，跟「本機沒資料」的意外遺失分開處理
    delete deckColorState[deck.id]; saveColorState();
    decks.splice(idx, 1);
    currentDeckId = decks[Math.max(0, idx - 1)].id;
    saveDecks(); renderDeckSwitcher(); renderDeckPanel(); updateTray(); renderGrid();
    showToast('已刪除牌組');
    // 用跟 local-change 一樣的 debounce delay（不是 0），這樣使用者刪完牌組後很快按「立即同步」時，
    // 這裡排的背景同步還沒開始跑，會被 hvScheduleAutoSync 的 clearTimeout 直接取消掉，
    // 避免「背景先跑一次 pushDeletes:false 的完整同步、使用者的手動同步又要排隊等它跑完再跑一次」
    // 兩趟完整 Firestore 讀取疊在一起，讓使用者覺得「按下去反應很慢」
    if (user) hvScheduleAutoSync('delete', 1500);
  });

  const shareOverlay = document.getElementById('share-modal-overlay');
  const closeShare = () => { shareOverlay.style.display = 'none'; };

  document.getElementById('deck-clear-btn').addEventListener('click', () => {
    const deck = getCurrentDeck();
    if (!deck) return;
    if (deck.cards.length === 0) { showToast('牌組已經是空的'); return; }
    const user = window.hvCloudSync?.currentUser;
    const cloudWarning = user
      ? '\n\n（雲端備份不會馬上被清空，要等你下次按「立即同步」才會真的覆蓋；在那之前如果反悔，可以用「用雲端覆蓋本機」找回來。）'
      : '';
    if (!confirm(`確定要清空「${deck.name}」的所有卡片嗎？${cloudWarning}`)) return;
    if (user) window.hvCloudSync.markRisky(user.uid, deck.id);
    deck.cards = [];
    deck.owned = {};
    delete deckColorState[deck.id]; saveColorState();
    saveDecks();
    renderDeckPanel(); updateTray(); renderGrid();
    showToast('已清空牌組');
  });

  // 牌組操作選單（改名/新增/複製/刪除/清空）：點任一項目或點外面都要收合
  const deckMenuDetails = document.getElementById('deck-menu-details');
  const deckMenuPopover = deckMenuDetails.querySelector('.deck-menu-popover');
  deckMenuDetails.addEventListener('click', e => {
    if (e.target.closest('.deck-menu-item')) deckMenuDetails.removeAttribute('open');
  });
  document.addEventListener('click', e => {
    if (deckMenuDetails.open && !deckMenuDetails.contains(e.target)) deckMenuDetails.removeAttribute('open');
  });
  // 牌組面板是貼底的 bottom sheet，卡片少的時候面板本身會縮到只剩內容高度，
  // 標題列下方可能沒有空間放彈出選單，這時要往上開，不然選單會被螢幕邊緣切掉
  deckMenuDetails.addEventListener('toggle', () => {
    if (!deckMenuDetails.open) return;
    const summaryRect = deckMenuDetails.querySelector('summary').getBoundingClientRect();
    const spaceBelow = window.innerHeight - summaryRect.bottom;
    deckMenuPopover.classList.toggle('open-up', spaceBelow < deckMenuPopover.offsetHeight + 12);
  });

  document.getElementById('deck-share-btn').addEventListener('click', openShareModal);
  document.getElementById('share-modal-close').addEventListener('click', closeShare);
  shareOverlay.addEventListener('click', e => { if (e.target === shareOverlay) closeShare(); });
  document.getElementById('share-copy-btn').addEventListener('click', e => {
    e.stopPropagation();
    copyShareUrlToClipboard();
  });

  document.getElementById('deck-reorganize-select').addEventListener('change', e => {
    if (colorModeActive) {
      colorModeSortKey = e.target.value === 'color' ? 'card_no' : e.target.value;
      colorModeSlots = buildColorModeSlots();
      renderColorModeGrid();
    } else {
      reorganizeDeck(e.target.value);
    }
  });
  document.getElementById('deck-color-mode-btn').addEventListener('click', toggleColorMode);
  document.getElementById('deck-color-picker-bar').querySelectorAll('.color-pick-btn').forEach(btn => {
    btn.addEventListener('click', () => applyBatchColor(btn.dataset.colorkey));
  });

  document.getElementById('analysis-back-btn').addEventListener('click', closeAnalysis);

  // 圖片匯出
  document.getElementById('deck-export-img-btn').addEventListener('click', exportDeckAsImage);

  // 圖片匯入
  document.getElementById('deck-import-img-btn').addEventListener('click', () => {
    document.getElementById('deck-import-img-file').click();
  });
  document.getElementById('deck-import-img-file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    importDeckFromImage(file);
    e.target.value = '';
  });

  // ── Qty Modal events ──
  document.getElementById('qty-cancel').addEventListener('click', closeQtyModal);
  document.getElementById('qty-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('qty-overlay')) closeQtyModal();
  });
  document.getElementById('qty-confirm').addEventListener('click', () => {
    if (!qtyPendingImageFile) return;
    const qty = Math.max(1, parseInt(document.getElementById('qty-input').value, 10) || 1);
    addCardToDeck(qtyPendingImageFile, qty);
    closeQtyModal();
  });
  document.getElementById('qty-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('qty-confirm').click();
    if (e.key === 'Escape') closeQtyModal();
  });
  document.getElementById('qty-minus').addEventListener('click', () => {
    const inp = document.getElementById('qty-input');
    const v = parseInt(inp.value, 10) || 1;
    if (v > 1) inp.value = v - 1;
  });
  document.getElementById('qty-plus').addEventListener('click', () => {
    const inp = document.getElementById('qty-input');
    const v = parseInt(inp.value, 10) || 1;
    const max = parseInt(inp.max, 10) || 40;
    if (v < max) inp.value = v + 1;
  });
}
</script>

// 卡圖離線快取：Service Worker 只快取 /images/ 底下的圖檔，不影響資料即時更新
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW 註冊失敗：', err);
    });
  });
}

<script>
// 頁面新舊版本偵測：iOS Safari 在同源分頁間跳轉（例如 promo.html ↔ index.html 互相連結）
// 常會用 bfcache（返回上一頁快取）直接還原記憶體裡的舊 DOM 快照；GitHub Pages 對 HTML
// 又是 Cache-Control: max-age=600，關掉整個瀏覽器 App 再重開、用「繼續瀏覽」還原分頁時，
// 也常是直接吃磁碟 HTTP 快取的舊頁面，完全不發網路請求，導致明明伺服器早就是最新版，
// 畫面卻卡在舊介面。GitHub Pages 不支援自訂 response header，沒辦法直接靠 Cache-Control 解決。
//
// 這裡不拿「上次查到的伺服器版本」存進 sessionStorage 當比對基準（那樣的話，只要曾經有一次
// 誤判把新版標記寫進去，之後同一 session 就永遠比對「成功」、卡死在舊畫面，且 sessionStorage
// 能否撐過整個瀏覽器 App 關閉重開也沒有保證）。改用 document.lastModified：這個值就是「這份
// 正在畫面上執行的 HTML」實際被瀏覽器認定的版本時間，即使是磁碟快取吐出來的舊頁面也一樣準，
// 不依賴任何跨 session 儲存，每次都直接拿它跟伺服器目前的 Last-Modified 比較。
(function () {
  // 這個分頁 session 最多自動 reload 一次：不管命中哪個伺服器版本都只嘗試一次，
  // 避免 document.lastModified 誤判、cache-bust 沒真的繞過某層快取…等任何邊界情況
  // 演變成無限 reload 迴圈。最壞後果只是「這個 session 停止自動偵測」，不是卡死畫面。
  var RELOADED_ONCE_KEY = 'hv_reloaded_once:' + location.pathname;
  var STALE_TOLERANCE_MS = 2000; // 秒級精度的容錯，避免時間戳邊界誤判
  var FETCH_TIMEOUT_MS = 6000; // 避免請求卡住讓 checking 永遠鎖住，之後所有觸發都失效
  var checking = false;

  function parseTag(str) {
    var t = str ? Date.parse(str) : NaN;
    return isNaN(t) ? null : t;
  }

  function alreadyReloadedOnce() {
    try { return sessionStorage.getItem(RELOADED_ONCE_KEY) === '1'; } catch (e) { return false; }
  }
  function markReloadedOnce() {
    try { sessionStorage.setItem(RELOADED_ONCE_KEY, '1'); } catch (e) {}
  }

  var selfModified = parseTag(document.lastModified);

  function checkVersion() {
    if (checking || selfModified === null || alreadyReloadedOnce()) return;
    checking = true;
    var controller = ('AbortController' in window) ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS) : null;
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store', signal: controller ? controller.signal : undefined })
      .then(function (res) {
        checking = false;
        if (timer) clearTimeout(timer);
        if (!res.ok) return;
        var serverModified = parseTag(res.headers.get('last-modified'));
        if (serverModified === null) return; // 網路異常等情況：保留目前頁面，不要動它
        if (serverModified <= selfModified + STALE_TOLERANCE_MS) return; // 目前就是最新版

        markReloadedOnce();
        var url = new URL(location.href);
        url.searchParams.set('_hv_cb', Date.now()); // 帶新的 query 讓瀏覽器/CDN 都當成全新網址處理
        location.replace(url.toString());
      })
      .catch(function () { checking = false; if (timer) clearTimeout(timer); });
  }

  checkVersion(); // 一般載入也要檢查：磁碟快取 / App 重開後的分頁還原都可能吐出舊頁面
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) checkVersion(); // 從 bfcache 還原
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkVersion(); // 分頁切回前景
  });
  setInterval(function () {
    if (document.visibilityState === 'visible') checkVersion();
  }, 5 * 60 * 1000); // 長時間停留前景、沒觸發上面任何事件時的補強
})();
</script>
