<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バボカ!! AI 對戰 / QR戰鬥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-gold: #f59e0b;
            --neon-cyan: #06b6d4;
            --neon-pink: #ec4899;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            letter-spacing: 0.05em;
        }

        .battle-setup {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .player-panel {
            background: var(--bg-card);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
            transition: all 0.3s ease;
        }

        .player-panel:hover {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
            border-color: var(--neon-gold);
        }

        .player-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--neon-gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 2px dashed var(--neon-cyan);
            padding: 2rem;
            text-align: center;
            background: rgba(6, 182, 212, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-wrapper:hover {
            border-color: var(--neon-gold);
            background: rgba(245, 158, 11, 0.05);
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            user-select: none;
        }

        .divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 1rem 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '─';
            display: inline-block;
            width: 40%;
            margin: 0 0.5rem;
        }

        .url-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .deck-preview {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .deck-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--neon-gold);
            margin-bottom: 0.5rem;
        }

        .deck-count {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .deck-count.warning {
            color: #fbbf24;
        }

        .deck-count.success {
            color: var(--neon-green);
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-badge.ready {
            background: rgba(16, 185, 129, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .status-badge.not-ready {
            background: rgba(239, 68, 68, 0.2);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .deck-preview-empty {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
        }

        .control-section {
            background: var(--bg-card);
            border: 2px solid var(--neon-gold);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-gold), var(--neon-cyan));
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-dark);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
            min-height: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-message.info {
            background: rgba(6, 182, 212, 0.1);
            color: var(--neon-cyan);
            border-left: 4px solid var(--neon-cyan);
        }

        .status-message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--neon-green);
            border-left: 4px solid var(--neon-green);
        }

        .status-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--neon-red);
            border-left: 4px solid var(--neon-red);
        }

        .status-message.hidden {
            display: none;
        }

        #replay-section {
            margin-top: 2rem;
            background: var(--bg-card);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        #replay-section h2 {
            text-align: center;
            margin-bottom: 1rem;
            color: var(--neon-gold);
            font-size: 1.5rem;
        }

        #replay-iframe {
            width: 100%;
            height: 90vh;
            border: none;
            border-radius: 8px;
            background: var(--bg-dark);
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(6, 182, 212, 0.3);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .checkmark {
            display: inline-block;
            margin-right: 0.3rem;
        }

        @media (max-width: 768px) {
            .battle-setup {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            #replay-iframe {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>バボカ!! AI 對戰</h1>

        <div class="battle-setup">
            <!-- Player 1 -->
            <div class="player-panel">
                <div class="player-title">玩家 1</div>
                <div class="input-section">
                    <div class="file-input-wrapper" onclick="document.getElementById('qr-input-1').click()">
                        <input type="file" id="qr-input-1" accept="image/*">
                        <label for="qr-input-1" class="file-input-label">
                            📸 上傳 QR 碼圖片
                        </label>
                    </div>
                    <div class="divider">或</div>
                    <input
                        type="text"
                        id="url-input-1"
                        class="url-input"
                        placeholder="貼上牌組網址或編碼字串"
                    >
                </div>
                <div id="deck-preview-1" class="deck-preview">
                    <div class="deck-preview-empty">等待 QR 碼或網址...</div>
                </div>
            </div>

            <!-- Player 2 -->
            <div class="player-panel">
                <div class="player-title">玩家 2</div>
                <div class="input-section">
                    <div class="file-input-wrapper" onclick="document.getElementById('qr-input-2').click()">
                        <input type="file" id="qr-input-2" accept="image/*">
                        <label for="qr-input-2" class="file-input-label">
                            📸 上傳 QR 碼圖片
                        </label>
                    </div>
                    <div class="divider">或</div>
                    <input
                        type="text"
                        id="url-input-2"
                        class="url-input"
                        placeholder="貼上牌組網址或編碼字串"
                    >
                </div>
                <div id="deck-preview-2" class="deck-preview">
                    <div class="deck-preview-empty">等待 QR 碼或網址...</div>
                </div>
            </div>
        </div>

        <div class="control-section">
            <div class="button-group">
                <button id="battle-btn" class="btn btn-primary" disabled>
                    ⚡ 開始對戰！
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    🔄 重新設定
                </button>
            </div>
            <div id="status-msg" class="status-message hidden"></div>
        </div>

        <section id="replay-section" style="display:none;">
            <h2>🎬 對戰回放</h2>
            <iframe id="replay-iframe"></iframe>
        </section>
    </div>

    <!-- Load libraries -->
    <script src="/lz-string.min.js"></script>
    <script>if(typeof LZString==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"><\/script>')}</script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        // State management
        const state = {
            deck1: null,
            deck2: null
        };

        // DOM elements
        const qrInput1 = document.getElementById('qr-input-1');
        const qrInput2 = document.getElementById('qr-input-2');
        const urlInput1 = document.getElementById('url-input-1');
        const urlInput2 = document.getElementById('url-input-2');
        const deckPreview1 = document.getElementById('deck-preview-1');
        const deckPreview2 = document.getElementById('deck-preview-2');
        const battleBtn = document.getElementById('battle-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusMsg = document.getElementById('status-msg');
        const replaySection = document.getElementById('replay-section');
        const replayIframe = document.getElementById('replay-iframe');

        // Utility functions
        function showStatus(message, type = 'info') {
            statusMsg.textContent = message;
            statusMsg.className = `status-message ${type}`;
            if (type === 'info') {
                statusMsg.innerHTML = `<span class="loading-spinner"></span>${message}`;
            }
        }

        function hideStatus() {
            statusMsg.classList.add('hidden');
        }

        function updateBattleBtn() {
            battleBtn.disabled = !(state.deck1 && state.deck2);
        }

        // QR Code decoding
        async function decodeQRFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code) {
                            resolve(code.data);
                        } else {
                            reject(new Error('QR 讀取失敗'));
                        }
                    };
                    img.onerror = () => reject(new Error('圖片載入失敗'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('檔案讀取失敗'));
                reader.readAsDataURL(file);
            });
        }

        // Deck URL decoding
        function decodeDeckUrl(qrString) {
            let encoded = qrString.trim();

            // Try to extract from URL
            try {
                const urlStr = encoded.startsWith('http') ? encoded : 'https://x.com/?' + encoded;
                const url = new URL(urlStr);
                const deckParam = url.searchParams.get('deck');
                if (deckParam) {
                    encoded = deckParam;
                }
            } catch (e) {
                // Not a URL, treat as encoded string directly
            }

            try {
                const json = LZString.decompressFromEncodedURIComponent(encoded);
                if (!json) throw new Error('解碼失敗');

                const data = JSON.parse(json);
                if (!data.c || !Array.isArray(data.c)) throw new Error('牌組格式不正確');

                // Normalize card IDs
                const cards = {};
                let totalCount = 0;
                for (const [id, cnt] of data.c) {
                    const cardNo = String(id).replace(/-[A-Z]+\.webp$/i, '');
                    cards[cardNo] = (cards[cardNo] || 0) + cnt;
                    totalCount += cnt;
                }

                return {
                    name: data.n || '牌組',
                    cards: cards,
                    totalCount: totalCount
                };
            } catch (e) {
                throw new Error('牌組格式不正確');
            }
        }

        // Update preview
        function updatePreview(playerNum, deck) {
            const previewEl = playerNum === 1 ? deckPreview1 : deckPreview2;

            if (!deck) {
                previewEl.innerHTML = '<div class="deck-preview-empty">等待 QR 碼或網址...</div>';
                return;
            }

            const isValid = deck.totalCount === 40;
            const checkmark = isValid ? '✓' : '⚠';
            const countClass = isValid ? 'success' : 'warning';
            const statusClass = isValid ? 'ready' : 'not-ready';
            const statusText = isValid ? '✓ 就緒' : '✗ 未就緒';

            previewEl.innerHTML = `
                <div class="deck-name">${deck.name}</div>
                <div class="deck-count ${countClass}">
                    <span class="checkmark">${checkmark}</span>
                    ${deck.totalCount} 張
                </div>
                <span class="status-badge ${statusClass}">${statusText}</span>
            `;
        }

        // Handle QR file upload
        async function handleQRUpload(file, playerNum) {
            try {
                showStatus(`正在讀取玩家 ${playerNum} 的 QR 碼...`, 'info');
                const qrString = await decodeQRFromFile(file);
                const deck = decodeDeckUrl(qrString);

                if (playerNum === 1) {
                    state.deck1 = deck;
                } else {
                    state.deck2 = deck;
                }

                updatePreview(playerNum, deck);
                updateBattleBtn();
                hideStatus();
            } catch (e) {
                showStatus(`玩家 ${playerNum} 讀取失敗：${e.message}`, 'error');
            }
        }

        // Handle URL paste
        function handleUrlPaste(value, playerNum) {
            if (!value.trim()) {
                if (playerNum === 1) {
                    state.deck1 = null;
                } else {
                    state.deck2 = null;
                }
                updatePreview(playerNum, null);
                updateBattleBtn();
                return;
            }

            try {
                const deck = decodeDeckUrl(value);
                if (playerNum === 1) {
                    state.deck1 = deck;
                } else {
                    state.deck2 = deck;
                }
                updatePreview(playerNum, deck);
                updateBattleBtn();
                hideStatus();
            } catch (e) {
                showStatus(`玩家 ${playerNum} 牌組格式不正確`, 'error');
                if (playerNum === 1) {
                    state.deck1 = null;
                } else {
                    state.deck2 = null;
                }
                updatePreview(playerNum, null);
                updateBattleBtn();
            }
        }

        // Start battle
        async function startBattle() {
            if (!state.deck1 || !state.deck2) {
                showStatus('請載入兩個牌組', 'error');
                return;
            }

            if (state.deck1.totalCount !== 40 || state.deck2.totalCount !== 40) {
                showStatus('兩個牌組都必須正好 40 張卡', 'error');
                return;
            }

            try {
                showStatus('正在準備對戰...', 'info');

                const payload = {
                    deck1: { name: state.deck1.name, cards: state.deck1.cards },
                    deck2: { name: state.deck2.name, cards: state.deck2.cards }
                };

                const response = await fetch('/battle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`伺服器錯誤：${response.statusText}`);
                }

                const result = await response.json();

                if (result.ok && result.visual_replay_url) {
                    replayIframe.src = result.visual_replay_url;
                    replaySection.style.display = 'block';
                    const winDeck = result.winner === 1 ? state.deck1.name : state.deck2.name;
                    const score = `${result.p1_sets} – ${result.p2_sets}`;
                    showStatus(`🎉 ${winDeck} 獲勝！ (${score}，共 ${result.turns} 局)`, 'success');
                    replaySection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    throw new Error(result.error || '未知錯誤');
                }
            } catch (e) {
                showStatus(`對戰失敗：${e.message}`, 'error');
            }
        }

        // Reset all
        function resetAll() {
            state.deck1 = null;
            state.deck2 = null;
            qrInput1.value = '';
            qrInput2.value = '';
            urlInput1.value = '';
            urlInput2.value = '';
            updatePreview(1, null);
            updatePreview(2, null);
            replaySection.style.display = 'none';
            replayIframe.src = '';
            hideStatus();
            updateBattleBtn();
        }

        // Event listeners
        qrInput1.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleQRUpload(e.target.files[0], 1);
            }
        });

        qrInput2.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleQRUpload(e.target.files[0], 2);
            }
        });

        urlInput1.addEventListener('input', (e) => {
            handleUrlPaste(e.target.value, 1);
        });

        urlInput2.addEventListener('input', (e) => {
            handleUrlPaste(e.target.value, 2);
        });

        battleBtn.addEventListener('click', startBattle);
        resetBtn.addEventListener('click', resetAll);

        // Initialize
        updateBattleBtn();
    </script>
</body>
</html>
